<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projects by Rizky Aryendi Gumilang">
  <link rel="shortcut icon" href="./assets/img/pfp-with-bg.jpg" type="image/webp">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
  <link rel="stylesheet" href="./assets/css/projects.css">
  <title>Projects | Rizky Aryendi Gumilang</title>
</head>

<body>
  <main class="projects-page">
    <header class="projects-header">
      <a href="./index.html" class="back-link">
        <i class="uil uil-arrow-left"></i>
        Back to Portfolio
      </a>
    </header>

    <section class="projects-intro">
      <div>
        <p class="eyebrow">Portfolio</p>
        <h1>Projects</h1>
        <p>A collection of projects I have worked on.</p>
      </div>
      <div class="page-counter" aria-live="polite">
        <span id="current-page">01</span>
        <span class="counter-line"></span>
        <span id="total-pages">02</span>
      </div>
    </section>

    <section class="projects-section" aria-label="Projects">
      <div class="projects-grid" id="projects-grid"></div>

      <nav class="projects-pagination" aria-label="Projects pagination">
        <button class="pagination-arrow" id="previous-page" type="button" aria-label="Previous page">
          <i class="uil uil-arrow-left"></i>
        </button>

        <div class="pagination-pages" id="projects-pagination"></div>

        <button class="pagination-arrow" id="next-page" type="button" aria-label="Next page">
          <i class="uil uil-arrow-right"></i>
        </button>
      </nav>
    </section>
  </main>

  <script>
    /*
      PROJECT DATA
      ------------------------------------------------------------
      4 projects = 1 page.
      The order below determines the page:
        Page 1 -> projects 1-4
        Page 2 -> projects 5-8
        Page 3 -> projects 9-12
        and so on.

      TEMPLATE:
      Copy one object and paste it after the last project.
      When you add the 5th project, it automatically starts Page 2.
    */

    const PROJECTS_PER_PAGE = 4;

    const projects = [
      {
        title: "Netflix analytic Dashboard",
        category: "Data Analytics",
        description: "Creating Netflix customer behavior analytical dashboard and providing output from a number of films or TV Series that customers often watch from certain distribution, rating and most customer watch.",
        image: "./assets/img/Netflix-analytics dashbord.png",
        url: "#"
      },
      {
        title: "HR analytic Dashboard",
        category: "Data Analytics",
        description: "Creating Analytical Dashboard using Tableau for HR with attrition as the status and providing a number of output calculations for employees, gender, satisfaction rating, age, and education background.",
        image: "./assets/img/HR Analytics Dashboard.png",
        url: "#"
      },
      {
        title: "US Delay Flight 2017-2022",
        category: "Data Analytics",
        description: "Creating analytic dashboard using Tableau to calculate the number of delayed flights in the US with filtered airline regions and a 2017-2022 dataset.",
        image: "./assets/img/US Flight Delay 2017-2022.png",
        url: "#"
      },
      {
        title: "Restaurants Order Overview Dashboard",
        category: "Data Analytics",
        description: "Creating an analytical dashboard for restaurant order data and presenting key metrics and insights in an interactive dashboard.",
        image: "./assets/img/Resto-overview-dash.png",
        url: "https://lookerstudio.google.com/reporting/b357af35-231f-44e0-915e-1581a58369e8"
      },

      // ==================== PAGE 2 ====================
      {
        title: "API Text Cleansing",
        category: "Development",
        description: "An API that can clean text and files. After running the code, open localhost and add /docs to access the Text Cleansing API. This project was created for my bootcamp class.",
        image: "./assets/img/output.png",
        url: "https://github.com/rizkyaryendigumilang/23001042-15-Kiky-project-gold"
      },
      {
        title: "Wedding Invitation",
        category: "Web Development",
        description: "Handling a simple digital invitation project for a friend's wedding using HTML and CSS.",
        image: "./assets/img/Undangan Pernikahan Monica Wulandari & Bromo Ludhiro Yoesoep and 2 more pages - Personal - Microsoft_ Edge 2023-10-12 18-35-38.gif",
        url: "#"
      },

      // TEMPLATE — add projects here
      // {
      //   title: "Your Project Name",
      //   category: "Data Analytics",
      //   description: "Short description of what you built and what the project does.",
      //   image: "./assets/img/your-project-image.png",
      //   url: "https://your-project-link.com"
      // },
      // {
      //   title: "Another Project",
      //   category: "Development",
      //   description: "Short description of another project.",
      //   image: "./assets/img/another-project.png",
      //   url: "https://your-project-link.com"
      // }
    ];

    const grid = document.getElementById("projects-grid");
    const pagination = document.getElementById("projects-pagination");
    const previousButton = document.getElementById("previous-page");
    const nextButton = document.getElementById("next-page");
    const currentPageLabel = document.getElementById("current-page");
    const totalPagesLabel = document.getElementById("total-pages");

    let currentPage = 1;
    let transitionTimer;

    const totalPages = Math.max(1, Math.ceil(projects.length / PROJECTS_PER_PAGE));
    totalPagesLabel.textContent = String(totalPages).padStart(2, "0");

    function renderProjects(page, direction = 1) {
      const start = (page - 1) * PROJECTS_PER_PAGE;
      const visibleProjects = projects.slice(start, start + PROJECTS_PER_PAGE);

      clearTimeout(transitionTimer);
      grid.dataset.direction = direction > 0 ? "next" : "previous";
      grid.classList.add("is-changing");

      transitionTimer = window.setTimeout(() => {
        grid.innerHTML = visibleProjects.map((project) => {
          const external = project.url !== "#"
            ? 'target="_blank" rel="noopener noreferrer"'
            : "";

          return `
            <article class="project-card">
              <a href="${project.url}" class="project-image" ${external}>
                <img src="${project.image}" alt="${project.title}" loading="lazy">
              </a>
              <div class="project-content">
                <span class="project-category">${project.category}</span>
                <h2>${project.title}</h2>
                <p>${project.description}</p>
                <a href="${project.url}" class="project-link" ${external}>
                  View project
                  <i class="uil uil-arrow-up-right"></i>
                </a>
              </div>
            </article>
          `;
        }).join("");

        grid.classList.remove("is-changing");
      }, 420);
    }

    function renderPagination() {
      pagination.innerHTML = "";

      for (let page = 1; page <= totalPages; page++) {
        const button = document.createElement("button");
        button.className = "pagination-number";
        button.type = "button";
        button.textContent = String(page).padStart(2, "0");
        button.setAttribute("aria-label", `Go to page ${page}`);

        if (page === currentPage) {
          button.classList.add("active");
          button.setAttribute("aria-current", "page");
        }

        button.addEventListener("click", () => changePage(page));
        pagination.appendChild(button);
      }

      previousButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
      currentPageLabel.textContent = String(currentPage).padStart(2, "0");
    }

    function changePage(page) {
      if (page < 1 || page > totalPages || page === currentPage) return;

      const direction = page > currentPage ? 1 : -1;
      currentPage = page;

      renderProjects(currentPage, direction);
      renderPagination();

      document.querySelector(".projects-section").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    previousButton.addEventListener("click", () => changePage(currentPage - 1));
    nextButton.addEventListener("click", () => changePage(currentPage + 1));

    renderProjects(currentPage);
    renderPagination();
  </script>
</body>
</html>
